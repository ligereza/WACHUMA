openapi: 3.1.0
info:
  title: WACHUMA API
  version: 0.1.0
  description: API pública y protegida para el jardín digital biocultural.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string }
  /search:
    get:
      operationId: searchPublicKnowledge
      summary: Buscar en las proyecciones públicas del conocimiento
      description: Devuelve especies, manuales, relaciones culturales, fuentes, lugares y ejemplares que cumplen las reglas públicas de visibilidad y revisión. No busca en registros restringidos.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Resultados públicos con rutas y procedencia
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicSearchResult" }
  /species:
    get:
      operationId: listSpecies
      summary: Explorar especies y entidades biológicas publicables
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Especies publicables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesSummary"
  /species/{publicId}:
    get:
      operationId: getSpecies
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ficha de especie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesDocument"
        "404":
          description: No encontrada
  /scenes:
    get:
      operationId: listScenes
      summary: Listar escenas 3D publicables
      responses:
        "200":
          description: Escenas visibles para el público
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SceneSummary"
  /scenes/{publicId}:
    get:
      operationId: getScene
      summary: Obtener una escena 3D con filtros de visibilidad aplicados
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Escena 3D pública
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenSceneDocument"
        "404":
          description: Escena no encontrada
  /garden/specimens:
    get:
      operationId: listPublicSpecimens
      summary: Listar ejemplares con visibilidad pública
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Ejemplares públicos sin ubicaciones exactas privadas
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /garden/locations:
    get:
      operationId: listPublicGardenLocations
      summary: Listar ubicaciones públicas del jardín
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Ubicaciones públicas sin geometría exacta privada
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /specimens/{publicId}:
    get:
      operationId: getPublicSpecimen
      summary: Obtener un ejemplar público y su URL de identificación
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ejemplar público
          content:
            application/json:
              schema: { type: object }
        "404":
          description: Ejemplar no encontrado o no publicable
  /lineage/{publicId}:
    get:
      operationId: getPublicLineage
      summary: Obtener un árbol de linaje con relaciones públicas
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Árbol y relaciones de linaje publicables
          content:
            application/json:
              schema:
                type: object
                required: [subjectPublicId, relationships, tree]
                properties:
                  subjectPublicId: { type: string }
                  relationships: { type: array, items: { type: object } }
                  tree: { type: object }
        "404":
          description: Sujeto no encontrado o no publicable
  /guides:
    get:
      operationId: listGrowingGuides
      summary: Listar manuales de cultivo publicados
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Manuales publicados con claims versionados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GrowingGuide" }
  /guides/{publicId}:
    get:
      operationId: getGrowingGuide
      summary: Obtener un manual de cultivo publicado
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Manual publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrowingGuide" }
        "404":
          description: Manual no encontrado o no publicado
  /cultivation/events:
    get:
      operationId: listPublicCultivationEvents
      summary: Listar eventos de cultivo públicos
      parameters:
        - name: specimenPublicId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Observaciones y eventos sin ubicaciones exactas privadas
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /culture/relations:
    get:
      operationId: listPublicCulturalRelations
      summary: Listar relaciones culturales aceptadas y públicas
      parameters:
        - name: subjectPublicId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Relaciones con fuente, perspectiva, sensibilidad y contexto
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /map/places:
    get:
      operationId: listPublicPlaces
      summary: Obtener geometrías públicas redondeadas
      responses:
        "200":
          description: Lugares publicables sin geometría exacta
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /observations:
    get:
      operationId: listPublicObservations
      summary: Listar observaciones públicas con geometría segura y procedencia
      parameters:
        - name: subjectPublicId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Observaciones públicas sin geometría exacta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicObservation" }
  /claims:
    get:
      operationId: listPublicClaims
      summary: Listar afirmaciones públicas con evidencia y revisión
      parameters:
        - name: subjectPublicId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Afirmaciones aceptadas y atribuibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicClaim" }
  /derivations:
    get:
      operationId: listPublicDerivations
      summary: Listar eventos públicos de derivación de material biológico
      parameters:
        - name: subjectPublicId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Eventos y materiales derivados publicados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicDerivationEvent" }
  /traits:
    get:
      operationId: listPublicTraitMeasurements
      summary: Listar mediciones públicas de rasgos ecológicos o de cultivo
      parameters:
        - name: subjectPublicId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Mediciones con unidad, método y fuente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicTraitMeasurement" }
  /sources:
    get:
      operationId: listPublicSources
      summary: Listar bibliografía y fuentes atribuibles
      responses:
        "200":
          description: Fuentes enlazadas a datos públicos
          content:
            application/json:
              schema:
                type: array
                items: { type: object }

  /admin/source-records:
    get:
      operationId: listAdminSourceRecords
      summary: Listar snapshots externos pendientes de revisión editorial
      description: Devuelve registros importados con su licencia, atribución y estado de revisión. No publica datos por sí mismo.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: provider
          in: query
          required: false
          schema: { type: string, example: gbif }
        - name: status
          in: query
          required: false
          schema:
            { type: string, enum: [pending, accepted, rejected, superseded] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Registros externos para revisión
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSourceRecord" }
        "400": { description: Parámetros inválidos }
        "403": { description: Credenciales ausentes o inválidas }

  /admin/source-records/{sourceRecordId}/review:
    parameters:
      - name: sourceRecordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewAdminSourceRecord
      summary: Registrar la decisión editorial de un snapshot externo
      description: Aceptar requiere confirmar licencia, atribución y privacidad. Una licencia compatible puede hacer públicas las observaciones y medios asociados; una licencia no compatible permanece restringida.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSourceRecordReview" }
      responses:
        "200":
          description: Registro revisado y decisión auditada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSourceRecord" }
        "400": { description: Entrada inválida o confirmaciones incompletas }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Registro externo no encontrado }

  /admin/source-records/{sourceRecordId}/promote-taxon:
    parameters:
      - name: sourceRecordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: promoteAdminTaxonProjection
      summary: Promover una proyección taxonómica GBIF a la capa pública
      description: Es una decisión separada de la revisión de licencia. Solo opera sobre un source record GBIF de especie ya aceptado y exige confirmación taxonómica, de licencia, atribución y privacidad.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTaxonPromotion" }
      responses:
        "200":
          description: Proyección taxonómica promovida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTaxonPromotionResult" }
        "400": { description: Entrada inválida o licencia incompatible }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Registro o proyección no encontrados }
        "409":
          { description: Revisión previa o tipo de proyección incompatible }

  /admin/locations:
    get:
      operationId: listAdminLocations
      summary: Listar ubicaciones para gestión protegida
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ubicaciones visibles para el equipo autenticado
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/AdminLocation" },
                }
        "403": { description: Credenciales ausentes o inválidas }
        "503": { description: Persistencia no configurada }
    post:
      operationId: createAdminLocation
      summary: Crear una ubicación del jardín
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLocationInput" }
      responses:
        "201":
          description: Ubicación creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLocation" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "409": { description: Identificador duplicado }

  /admin/locations/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminLocation
      summary: Obtener una ubicación para gestión protegida
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ubicación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLocation" }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ubicación no encontrada }
    patch:
      operationId: updateAdminLocation
      summary: Actualizar una ubicación
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLocationUpdate" }
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLocation" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ubicación no encontrada }
    delete:
      operationId: archiveAdminLocation
      summary: Archivar una ubicación sin eliminar su historial
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Ubicación archivada }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ubicación no encontrada }

  /admin/specimens:
    get:
      operationId: listAdminSpecimens
      summary: Listar ejemplares para gestión protegida
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ejemplares, incluidos los restringidos
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/AdminSpecimen" },
                }
        "403": { description: Credenciales ausentes o inválidas }
    post:
      operationId: createAdminSpecimen
      summary: Crear un ejemplar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSpecimenInput" }
      responses:
        "201":
          description: Ejemplar creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSpecimen" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Entidad biológica no encontrada }

  /admin/garden/intake/specimens:
    post:
      operationId: intakeAdminGardenSpecimen
      summary: Incorporar un ejemplar real con procedencia explícita
      description: Crea un ejemplar restringido y su source record en una transacción. La visibilidad pública requiere la revisión posterior del source record; este endpoint nunca acepta una entrada pública directa.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGardenSpecimenIntake" }
      responses:
        "201":
          description: Ejemplar incorporado y pendiente de revisión
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminGardenSpecimenIntakeResult" }
        "200":
          description: Entrada repetida de forma idempotente
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminGardenSpecimenIntakeResult" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Entidad o fuente no encontrada }
        "409": { description: El identificador ya pertenece a otra procedencia }

  /admin/lineage/relationships:
    post:
      operationId: createAdminLineageRelationship
      summary: Incorporar una relación de linaje con procedencia explícita
      description: Crea una relación entre entidades biológicas o ejemplares y su source record en una transacción. El árbol público sólo la expone después de una revisión aceptada del source record.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AdminLineageRelationshipInput" }
      responses:
        "201":
          description: Relación incorporada y pendiente de revisión
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminLineageRelationshipResult" }
        "200":
          description: Entrada repetida de forma idempotente
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdminLineageRelationshipResult" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Sujeto o fuente no encontrada }

  /admin/specimens/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminSpecimen
      summary: Obtener un ejemplar para gestión protegida
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ejemplar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSpecimen" }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ejemplar no encontrado }
    patch:
      operationId: updateAdminSpecimen
      summary: Actualizar un ejemplar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSpecimenUpdate" }
      responses:
        "200":
          description: Ejemplar actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSpecimen" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ejemplar no encontrado }
    delete:
      operationId: archiveAdminSpecimen
      summary: Archivar un ejemplar sin borrar su procedencia
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Ejemplar archivado }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ejemplar no encontrado }

  /admin/specimens/{publicId}/location:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: assignAdminSpecimenLocation
      summary: Asignar ubicación actual a un ejemplar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationPublicId]
              properties:
                locationPublicId: { type: string }
                startsAt: { type: string, format: date-time }
      responses:
        "200":
          description: Asignación actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSpecimen" }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ejemplar o ubicación no encontrada }
    delete:
      operationId: clearAdminSpecimenLocation
      summary: Cerrar la ubicación actual de un ejemplar
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Asignación cerrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSpecimen" }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ejemplar no encontrado }

  /admin/cultivation/events:
    post:
      operationId: createAdminCultivationEvent
      summary: Registrar un evento de cultivo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCultivationEventInput" }
      responses:
        "201":
          description: Evento registrado
          content:
            application/json:
              schema: { type: object }
        "400": { description: Entrada inválida }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Ejemplar, ubicación o fuente no encontrada }

  /admin/culture/relations:
    get:
      operationId: listAdminCulturalRelations
      summary: Listar relaciones culturales para revisión protegida
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Relaciones, incluidos borradores y restringidas
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: "#/components/schemas/AdminCulturalRelation" },
                }
        "403": { description: Credenciales ausentes o inválidas }
    post:
      operationId: createAdminCulturalRelation
      summary: Registrar una relación cultural con procedencia explícita
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCulturalRelationInput" }
      responses:
        "201":
          description: Relación registrada como borrador o revisión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCulturalRelation" }
        "400": { description: Entrada inválida o contexto insuficiente }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Sujeto, comunidad, lugar o fuente no encontrada }

  /admin/culture/relations/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminCulturalRelation
      summary: Obtener una relación para revisión protegida
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Relación cultural
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCulturalRelation" }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Relación no encontrada }

  /admin/culture/relations/{publicId}/takedown:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: takedownAdminCulturalRelation
      summary: Retirar una relación cultural y conservar su procedencia
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCulturalTakedownInput" }
      responses:
        "200":
          description: Relación retirada, restringida y marcada como rechazada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCulturalRelation" }
        "400": { description: Motivo inválido }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Relación no encontrada }
    patch:
      operationId: updateAdminCulturalRelation
      summary: Actualizar contexto o estado de revisión
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCulturalRelationUpdate" }
      responses:
        "200":
          description: Relación actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCulturalRelation" }
        "400": { description: Entrada inválida o contexto insuficiente }
        "403": { description: Credenciales ausentes o inválidas }
        "404": { description: Relación no encontrada }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object }
    AdminSourceRecord:
      type: object
      required:
        [
          id,
          providerKey,
          sourceRecordId,
          retrievedAt,
          license,
          attribution,
          assertionType,
          rawPayload,
          status,
          targets,
        ]
      properties:
        id: { type: string, format: uuid }
        providerKey: { type: string }
        sourceRecordId: { type: string }
        sourceUrl: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        license: { type: string }
        attribution: { type: string }
        assertionType: { type: string }
        rawPayload: { type: object, additionalProperties: true }
        status:
          { type: string, enum: [pending, accepted, rejected, superseded] }
        reviewNotes: { type: string }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
        targets:
          type: array
          items: { $ref: "#/components/schemas/AdminSourceRecordTarget" }
    AdminSourceRecordTarget:
      type: object
      required: [kind]
      properties:
        kind:
          {
            type: string,
            enum:
              [
                taxon,
                biological_entity,
                observation,
                media,
                specimen,
                lineage_relationship,
                external_identifier,
              ],
          }
        publicId: { type: string }
        id: { type: string, format: uuid }
        visibility:
          {
            type: string,
            enum: [public, restricted, sensitive, community-controlled],
          }
        uri: { type: string, format: uri }
        title: { type: string }
        mediaType: { type: string }
        license: { type: string }
        namespace: { type: string }
        identifier: { type: string }
        canonicalUrl: { type: string, format: uri }
    AdminSourceRecordReview:
      type: object
      required:
        [
          reviewer,
          decision,
          note,
          licenseConfirmed,
          attributionConfirmed,
          privacyConfirmed,
        ]
      properties:
        reviewer: { type: string, minLength: 1 }
        decision: { type: string, enum: [accepted, rejected] }
        note: { type: string }
        licenseConfirmed: { type: boolean }
        attributionConfirmed: { type: boolean }
        privacyConfirmed: { type: boolean }
    AdminTaxonPromotion:
      type: object
      required:
        [
          reviewer,
          note,
          taxonomyConfirmed,
          licenseConfirmed,
          attributionConfirmed,
          privacyConfirmed,
        ]
      properties:
        reviewer: { type: string, minLength: 1 }
        note: { type: string, minLength: 1 }
        taxonomyConfirmed: { type: boolean }
        licenseConfirmed: { type: boolean }
        attributionConfirmed: { type: boolean }
        privacyConfirmed: { type: boolean }
    AdminTaxonPromotionResult:
      type: object
      required:
        [
          sourceRecordId,
          taxonPublicId,
          biologicalEntityPublicId,
          visibility,
          reviewer,
          promotedAt,
        ]
      properties:
        sourceRecordId: { type: string, format: uuid }
        taxonPublicId: { type: string }
        biologicalEntityPublicId: { type: string }
        visibility: { type: string, enum: [public] }
        reviewer: { type: string }
        promotedAt: { type: string, format: date-time }
    GrowingGuide:
      type: object
      required: [publicId, guideKey, version, title, status, sections, claims]
      properties:
        id: { type: string }
        publicId: { type: string }
        guideKey: { type: string }
        version: { type: integer, minimum: 1 }
        title: { type: string }
        taxonId: { type: string }
        biologicalEntityId: { type: string }
        subjectPublicId: { type: string }
        climateContext: { type: string }
        techniqueContext: { type: string }
        regionContext: { type: string }
        status: { type: string, enum: [draft, review, published, archived] }
        summary: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [sectionKey, status, claimCount, sourcePublicIds]
            properties:
              sectionKey: { type: string }
              status:
                {
                  type: string,
                  enum: [documented, in_review, not_documented, not_applicable],
                }
              claimCount: { type: integer, minimum: 0 }
              sourcePublicIds: { type: array, items: { type: string } }
              note: { type: string }
        claims:
          type: array
          items:
            type: object
            required: [id, sectionKey, statement, evidenceLevel, assertionType]
            properties:
              id: { type: string }
              sectionKey: { type: string }
              statement: { type: string }
              evidenceLevel: { type: string }
              sourceId: { type: string }
              sourcePublicId: { type: string }
              assertionType: { type: string }
    SpeciesSummary:
      type: object
      required:
        [
          publicId,
          scientificName,
          displayName,
          rank,
          taxonomicStatus,
          entityType,
          visibility,
          externalIdentifiers,
        ]
      properties:
        publicId: { type: string }
        scientificName: { type: string }
        displayName: { type: string }
        rank: { type: string }
        taxonomicStatus: { type: string }
        entityType: { type: string }
        acceptedName: { type: string }
        visibility: { type: string }
        externalIdentifiers:
          type: array
          items:
            type: object
            required: [namespace, identifier]
            properties:
              namespace: { type: string }
              identifier: { type: string }
              canonicalUrl: { type: string, format: uri }
    PublicSearchResult:
      type: object
      required: [kind, publicId, title, summary, path, sourcePublicIds]
      properties:
        kind:
          type: string
          enum: [species, guide, cultural_relation, source, place, specimen]
        publicId: { type: string }
        title: { type: string }
        summary: { type: string }
        path: { type: string }
        subjectPublicId: { type: string }
        sourcePublicIds:
          type: array
          items: { type: string }
    PublicObservation:
      type: object
      required:
        [
          publicId,
          subjectPublicId,
          observedAt,
          observationBasis,
          environment,
          uncertainty,
        ]
      properties:
        publicId: { type: string }
        subjectPublicId: { type: string }
        observedAt: { type: string, format: date-time }
        observationBasis:
          { type: string, enum: [human, photo, specimen, external] }
        protocolPublicId: { type: string }
        placePublicId: { type: string }
        placeName: { type: string }
        geometryPublic: { type: object }
        environment: { type: object }
        uncertainty: { type: object }
        sourcePublicId: { type: string }
        sourceRecordId: { type: string }
    PublicClaim:
      type: object
      required:
        [
          publicId,
          subjectType,
          subjectId,
          predicate,
          assertionType,
          evidenceLevel,
          sourceId,
          visibility,
          license,
          reviewStatus,
        ]
      properties:
        publicId: { type: string }
        subjectType: { type: string }
        subjectId: { type: string }
        subjectPublicId: { type: string }
        predicate: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        objectUri: { type: string, format: uri }
        objectText: { type: string }
        value: { type: object }
        assertionType: { type: string }
        evidenceLevel: { type: string }
        authorAgentId: { type: string }
        sourceId: { type: string }
        sourcePublicId: { type: string }
        sourceRecordId: { type: string }
        authorPerspective: { type: string }
        recordedOn: { type: string, format: date }
        visibility: { type: string }
        license: { type: string }
        reviewStatus: { type: string }
    PublicDerivationEvent:
      type: object
      required: [publicId, eventType, occurredAt, visibility, materials]
      properties:
        publicId: { type: string }
        eventType: { type: string }
        method: { type: string }
        occurredAt: { type: string, format: date-time }
        operatorAgentId: { type: string }
        locationId: { type: string }
        sourceId: { type: string }
        notes: { type: string }
        visibility: { type: string }
        materials: { type: array, items: { type: object } }
    PublicTraitMeasurement:
      type: object
      required:
        [
          publicId,
          traitDefinitionId,
          traitNamespace,
          traitIdentifier,
          traitLabel,
          measuredAt,
          uncertainty,
          sourceId,
          visibility,
        ]
      properties:
        publicId: { type: string }
        traitDefinitionId: { type: string }
        traitNamespace: { type: string }
        traitIdentifier: { type: string }
        traitLabel: { type: string }
        taxonId: { type: string }
        biologicalEntityId: { type: string }
        specimenId: { type: string }
        observationId: { type: string }
        valueNumeric: { type: number }
        valueText: { type: string }
        value: { type: object }
        unit: { type: string }
        measuredAt: { type: string, format: date-time }
        method: { type: string }
        uncertainty: { type: object }
        protocolId: { type: string }
        sourceId: { type: string }
        visibility: { type: string }
    SpeciesDocument:
      allOf:
        - $ref: "#/components/schemas/SpeciesSummary"
        - type: object
          required:
            [
              id,
              description,
              ecology,
              distribution,
              cultivation,
              vernacularNames,
              culturalRelations,
              history,
              sources,
              relatedSpecies,
              media,
            ]
          properties:
            id: { type: string }
            taxonId: { type: string }
            taxonomicVariants: { type: array, items: { type: object } }
            description: { type: string }
            ecology: { type: array, items: { type: string } }
            distribution:
              type: array
              items:
                type: object
                required: [label]
                properties:
                  placePublicId: { type: string }
                  observationPublicId: { type: string }
                  label: { type: string }
                  geometry: { type: object }
                  sourcePublicId: { type: string }
            cultivation: { type: array, items: { type: string } }
            vernacularNames: { type: array, items: { type: object } }
            culturalRelations: { type: array, items: { type: object } }
            history: { type: array, items: { type: string } }
            sources: { type: array, items: { type: object } }
            relatedSpecies:
              {
                type: array,
                items: { $ref: "#/components/schemas/SpeciesSummary" },
              }
            media: { type: array, items: { type: object } }
    SceneSummary:
      type: object
      required: [publicId, name, visibility, version, objectCount]
      properties:
        publicId: { type: string }
        name: { type: string }
        visibility: { type: string }
        version: { type: integer }
        objectCount: { type: integer }
    GardenSceneDocument:
      type: object
      required: [schemaVersion, scene, assets, objects, recipes]
      properties:
        schemaVersion: { type: string }
        scene: { type: object }
        assets: { type: array, items: { type: object } }
        objects: { type: array, items: { type: object } }
        recipes: { type: array, items: { type: object } }
    AdminLocationInput:
      type: object
      required: [publicId, name, locationType, visibility]
      properties:
        publicId: { type: string }
        name: { type: string }
        locationType: { type: string }
        parentPublicId: { type: string }
        geometryPublic: { type: object }
        geometryExact:
          { type: object, description: Nunca se devuelve en DTOs públicos }
        visibility: { type: string }
        notes: { type: string }
    AdminLocationUpdate:
      type: object
      minProperties: 1
      description: Todos los campos son opcionales en una actualización; publicId se toma de la ruta.
      properties:
        name: { type: string }
        locationType: { type: string }
        parentPublicId: { type: string }
        geometryPublic: { type: object }
        geometryExact:
          { type: object, description: Nunca se devuelve en DTOs públicos }
        visibility: { type: string }
        notes: { type: string }
    AdminLocation:
      type: object
      required: [publicId, name, locationType, visibility]
      properties:
        publicId: { type: string }
        name: { type: string }
        locationType: { type: string }
        parentPublicId: { type: string }
        geometryPublic: { type: object }
        visibility: { type: string }
        notes: { type: string }
    AdminSpecimenInput:
      type: object
      required:
        [publicId, specimenType, biologicalEntityPublicId, status, visibility]
      properties:
        publicId: { type: string }
        specimenType: { type: string }
        biologicalEntityPublicId: { type: string }
        status: { type: string }
        visibility: { type: string }
        acquiredAt: { type: string, format: date-time }
        notes: { type: string }
    AdminGardenSpecimenIntake:
      type: object
      required:
        [
          publicId,
          specimenType,
          biologicalEntityPublicId,
          status,
          visibility,
          provenance,
        ]
      description: La incorporación nace restringida; la publicación requiere revisar el source record asociado.
      properties:
        publicId: { type: string }
        specimenType: { type: string }
        biologicalEntityPublicId: { type: string }
        status: { type: string }
        visibility:
          { type: string, enum: [restricted, sensitive, community-controlled] }
        acquiredAt: { type: string, format: date-time }
        notes: { type: string }
        provenance:
          type: object
          required:
            [
              sourceRecordId,
              retrievedAt,
              license,
              attribution,
              rawPayload,
              importerVersion,
              assertionType,
              sourcePublicId,
            ]
          properties:
            sourceRecordId: { type: string }
            sourceUrl: { type: string, format: uri }
            retrievedAt: { type: string, format: date-time }
            license: { type: string }
            attribution: { type: string }
            rawPayload: { type: object }
            importerVersion: { type: string }
            assertionType:
              {
                type: string,
                enum: [contemporary_observation, editorial_interpretation],
              }
            sourcePublicId: { type: string }
    AdminLineageRelationshipInput:
      type: object
      required: [relationshipType, parent, child, provenance]
      properties:
        relationshipType:
          type: string
          enum:
            [
              parent_of,
              cutting_of,
              clone_of,
              seed_from,
              culture_from,
              isolate_from,
              cross_of,
            ]
        parent:
          $ref: "#/components/schemas/AdminLineageSubject"
        child:
          $ref: "#/components/schemas/AdminLineageSubject"
        generationLabel: { type: string }
        occurredAt: { type: string, format: date-time }
        notes: { type: string }
        provenance:
          $ref: "#/components/schemas/AdminLineageProvenance"
    AdminLineageSubject:
      type: object
      required: [kind, publicId]
      properties:
        kind: { type: string, enum: [biological_entity, specimen] }
        publicId: { type: string }
    AdminLineageProvenance:
      type: object
      required:
        [
          sourceRecordId,
          retrievedAt,
          license,
          attribution,
          rawPayload,
          importerVersion,
          assertionType,
          sourcePublicId,
        ]
      properties:
        sourceRecordId: { type: string }
        sourceUrl: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        license: { type: string }
        attribution: { type: string }
        rawPayload: { type: object }
        importerVersion: { type: string }
        assertionType:
          {
            type: string,
            enum: [contemporary_observation, editorial_interpretation],
          }
        sourcePublicId: { type: string }
    AdminLineageRelationshipResult:
      type: object
      required:
        [
          id,
          relationshipType,
          parent,
          child,
          sourcePublicId,
          sourceRecordId,
          sourceRecordKey,
          sourceRecordStatus,
          created,
        ]
      properties:
        id: { type: string, format: uuid }
        relationshipType: { type: string }
        parent: { $ref: "#/components/schemas/AdminLineageSubject" }
        child: { $ref: "#/components/schemas/AdminLineageSubject" }
        generationLabel: { type: string }
        occurredAt: { type: string, format: date-time }
        notes: { type: string }
        sourcePublicId: { type: string }
        sourceRecordId: { type: string, format: uuid }
        sourceRecordKey: { type: string }
        sourceRecordStatus:
          { type: string, enum: [pending, accepted, rejected, superseded] }
        created: { type: boolean }
    AdminGardenSpecimenIntakeResult:
      type: object
      required:
        [specimen, sourceRecordId, sourceRecordKey, sourceRecordStatus, created]
      properties:
        specimen: { $ref: "#/components/schemas/AdminSpecimen" }
        sourceRecordId: { type: string, format: uuid }
        sourceRecordKey: { type: string }
        sourceRecordStatus:
          { type: string, enum: [pending, accepted, rejected, superseded] }
        created: { type: boolean }
    AdminSpecimenUpdate:
      type: object
      minProperties: 1
      properties:
        specimenType: { type: string }
        biologicalEntityPublicId: { type: string }
        status: { type: string }
        visibility: { type: string }
        acquiredAt: { type: string, format: date-time }
        notes: { type: string }
    AdminSpecimen:
      type: object
      required:
        [publicId, specimenType, biologicalEntityPublicId, status, visibility]
      properties:
        publicId: { type: string }
        specimenType: { type: string }
        biologicalEntityPublicId: { type: string }
        status: { type: string }
        visibility: { type: string }
        acquiredAt: { type: string, format: date-time }
        notes: { type: string }
        currentLocationPublicId: { type: string }
    AdminCultivationEventInput:
      type: object
      required: [specimenPublicId, eventType, occurredAt]
      properties:
        specimenPublicId: { type: string }
        locationPublicId: { type: string }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        notes: { type: string }
        measurements: { type: object }
        sourcePublicId: { type: string }
    AdminCulturalRelationInput:
      type: object
      required:
        [
          publicId,
          relationType,
          subjectPublicId,
          description,
          sourcePublicId,
          evidenceLevel,
          assertionType,
          authorPerspective,
          sensitivity,
          accessLevel,
          license,
          reviewStatus,
        ]
      properties:
        publicId: { type: string }
        relationType: { type: string }
        subjectPublicId: { type: string }
        valueText: { type: string }
        description: { type: string }
        culturePublicId: { type: string }
        communityPublicId: { type: string }
        placePublicId: { type: string }
        historicalPeriodPublicId: { type: string }
        documentedByAgentPublicId: { type: string }
        sourcePublicId: { type: string }
        evidenceLevel: { type: string }
        assertionType: { type: string }
        authorPerspective: { type: string }
        sensitivity: { type: string }
        accessLevel: { type: string }
        license: { type: string }
        reviewNote: { type: string }
        reviewStatus: { type: string }
        recordedOn: { type: string, format: date }
      anyOf:
        - required: [communityPublicId]
        - required: [culturePublicId]
    AdminCulturalRelationUpdate:
      type: object
      minProperties: 1
      properties:
        relationType: { type: string }
        valueText: { type: string }
        description: { type: string }
        culturePublicId: { type: string, nullable: true }
        communityPublicId: { type: string }
        placePublicId: { type: string }
        historicalPeriodPublicId: { type: string, nullable: true }
        documentedByAgentPublicId: { type: string, nullable: true }
        sourcePublicId: { type: string }
        evidenceLevel: { type: string }
        assertionType: { type: string }
        authorPerspective: { type: string }
        sensitivity: { type: string }
        accessLevel: { type: string }
        license: { type: string }
        reviewNote: { type: string }
        reviewStatus: { type: string }
        reviewer: { type: string, minLength: 1, maxLength: 160 }
        recordedOn: { type: string, format: date }
    AdminCulturalTakedownInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 4000 }
        reviewer: { type: string, minLength: 1, maxLength: 160 }
    AdminCulturalRelation:
      allOf:
        - $ref: "#/components/schemas/AdminCulturalRelationInput"
        - type: object
          properties:
            reviewedBy: { type: string }
            reviewedAt: { type: string, format: date-time }
