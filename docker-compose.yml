services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wachuma}
      POSTGRES_USER: ${POSTGRES_USER:-wachuma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wachuma-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
